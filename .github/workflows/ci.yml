name: ci

# One job covers the whole workspace: every package is type-checked, tested and built from the root,
# and `npm run check` is exactly what a contributor runs locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite takes about a minute; a hang should fail the run instead of holding a runner.
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json asks for >=22; the lowest supported line is what CI should prove.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check, test and build
        run: npm run check
