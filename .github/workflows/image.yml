name: image

# The browser image is the only artifact here, and its version tracks the Patchright driver inside it,
# so it has its own tag line: `browser-v1.64.3` publishes 1.64.3, 1.64, 1 and latest.
#
# The job runs in the runner's Ubuntu container, and the runner carries its own docker daemon (the
# dind image): the job talks to that daemon, so nothing here touches the machine's own container
# engine and the build cache stays in the runner's volume.
on:
  push:
    tags:
      - 'browser-v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the image. Uncheck to only build.'
        type: boolean
        default: true
      tag:
        description: 'Extra tag to publish (empty for none).'
        type: string
        default: ''
      platform:
        description: 'Target platform. arm64 needs qemu binfmt registered on the runner host.'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64
  pull_request:
    paths:
      - 'image/**'
      - '.github/workflows/image.yml'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: search-browser
  # One place decides whether this run publishes; everything downstream reads it.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Check the docker daemon
        run: docker version --format 'daemon {{.Server.Version}}'

      - name: Work out the tags
        id: tags
        run: |
          set -eu
          platform="${{ inputs.platform || 'linux/amd64' }}"
          case "${GITHUB_REF_NAME}" in
            browser-v*)
              version="${GITHUB_REF_NAME#browser-v}"
              major="$(echo "$version" | cut -d. -f1)"
              minor="$(echo "$version" | cut -d. -f1-2)"
              tags="${version} ${minor} ${major} latest"
              ;;
            *)
              tags="latest sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
              ;;
          esac
          if [ -n "${{ inputs.tag }}" ]; then tags="${tags} ${{ inputs.tag }}"; fi
          printf 'platform=%s\n' "$platform" >> "$GITHUB_OUTPUT"
          printf 'tags<<TAGS\n%s\nTAGS\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "platform: $platform"
          echo "tags: $tags"

      - name: Build
        env:
          PLATFORM: ${{ steps.tags.outputs.platform }}
        run: |
          set -eu
          docker build \
            --platform "${PLATFORM}" \
            --label "org.opencontainers.image.title=Search browser for @nite07/search-core" \
            --label "org.opencontainers.image.description=Patchright-driven Google Chrome behind a token-protected Playwright endpoint, with a VNC window for the sign-in" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE_NAME}:build" \
            image/
          docker image inspect "${IMAGE_NAME}:build" --format 'built {{.Id}} ({{.Size}} bytes) for {{.Architecture}}'

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this repository."
            exit 1
          fi
          targets="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          # GHCR is optional: it needs a GitHub token that can write packages, which a Gitea runner
          # has no way to mint on its own.
          if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
            targets="${targets} ghcr.io/${GHCR_USERNAME}/${IMAGE_NAME}"
          else
            echo "no GHCR secrets: publishing to Docker Hub only"
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin docker.io
          if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
            echo "${GHCR_TOKEN}" | docker login -u "${GHCR_USERNAME}" --password-stdin ghcr.io
          fi
          for target in $targets; do
            echo "$TAGS" | while read -r tag; do
              [ -n "$tag" ] || continue
              docker tag "${IMAGE_NAME}:build" "${target}:${tag}"
              docker push "${target}:${tag}"
              echo "pushed ${target}:${tag}"
            done
          done

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          PLATFORM: ${{ steps.tags.outputs.platform }}
        run: |
          echo "image: ${IMAGE_NAME}"
          echo "platform: ${PLATFORM}"
          echo "publish: ${PUBLISH}"
          echo "tags: $(echo "$TAGS" | tr '\n' ' ')"
