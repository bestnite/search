name: image

# The browser image is the only artifact here, and its version tracks the Patchright driver inside it,
# so it has its own tag line: `browser-v1.64.3` publishes 1.64.3, 1.64, 1 and latest.
#
# The job runs in the runner's Ubuntu container: that container is the isolation boundary, with its own
# network and filesystem. Building needs the image store, so the job gets the machine's podman socket
# mounted and drives it through podman's own API — the docker CLI's build path over that same socket is
# what fails on oom_score_adj, while a plain docker run over it succeeds.
on:
  push:
    tags:
      - 'browser-v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the image. Uncheck to only build.'
        type: boolean
        default: true
      tag:
        description: 'Extra tag to publish (empty for none).'
        type: string
        default: ''
      platform:
        description: 'Target platform. arm64 needs qemu binfmt registered on the runner host.'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64
  pull_request:
    paths:
      - 'image/**'
      - '.github/workflows/image.yml'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: search-browser
  # The socket the job container has mounted, and the client that speaks its native API.
  PODMAN_URL: unix:///run/podman/podman.sock
  # One place decides whether this run publishes; everything downstream reads it.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install the podman client
        run: |
          set -eu
          # The job image ships docker but not podman; the remote client is enough to drive the socket.
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq podman-remote
          podman-remote --url "${PODMAN_URL}" version --format 'server {{.Server.Version}}'

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/search-browser
          # latest is assigned explicitly below rather than by flavor, because a main-branch build and
          # a release tag are both "latest" here and metadata would otherwise also add it to sha runs.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Search browser for @nite07/search-core
            org.opencontainers.image.description=Patchright-driven Google Chrome behind a token-protected Playwright endpoint, with a VNC window for the sign-in
          tags: |
            type=match,pattern=browser-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=browser-v(\d+\.\d+),group=1
            type=match,pattern=browser-v(\d+),group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/browser-v') }}
            type=raw,value=sha-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/browser-v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build
        env:
          PLATFORM: ${{ inputs.platform || 'linux/amd64' }}
        run: |
          set -eu
          podman-remote --url "${PODMAN_URL}" build \
            --platform "${PLATFORM}" \
            --label "org.opencontainers.image.title=Search browser for @nite07/search-core" \
            --label "org.opencontainers.image.description=Patchright-driven Google Chrome behind a token-protected Playwright endpoint, with a VNC window for the sign-in" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE_NAME}:build" \
            image/
          podman-remote --url "${PODMAN_URL}" image inspect "${IMAGE_NAME}:build" --format 'built {{.Id}} ({{.Size}} bytes) for {{.Architecture}}'

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this repository."
            exit 1
          fi
          podman_remote() { podman-remote --url "${PODMAN_URL}" "$@"; }
          # metadata-action hands back complete references, one per line.
          if [ -z "${TAGS:-}" ]; then
            echo "::error::no tags were produced"
            exit 1
          fi
          # GHCR is optional: it needs a GitHub token that can write packages, which a Gitea runner
          # has no way to mint on its own.
          ghcr="${GHCR_USERNAME:+1}"
          if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
            echo "${GHCR_TOKEN}" | podman_remote login -u "${GHCR_USERNAME}" --password-stdin ghcr.io
          else
            ghcr=""
            echo "no GHCR secrets: publishing to Docker Hub only"
          fi
          echo "${DOCKERHUB_TOKEN}" | podman_remote login -u "${DOCKERHUB_USERNAME}" --password-stdin docker.io
          for ref in $TAGS; do
            podman_remote tag "${IMAGE_NAME}:build" "$ref"
            podman_remote push "$ref"
            echo "pushed $ref"
            if [ -n "$ghcr" ]; then
              tag="${ref##*:}"
              podman_remote tag "${IMAGE_NAME}:build" "ghcr.io/${GHCR_USERNAME}/${IMAGE_NAME}:${tag}"
              podman_remote push "ghcr.io/${GHCR_USERNAME}/${IMAGE_NAME}:${tag}"
              echo "pushed ghcr.io/${GHCR_USERNAME}/${IMAGE_NAME}:${tag}"
            fi
          done

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORM: ${{ inputs.platform || 'linux/amd64' }}
        run: |
          echo "image: ${IMAGE_NAME}"
          echo "platform: ${PLATFORM}"
          echo "publish: ${PUBLISH}"
          echo "tags: $(echo "$TAGS" | tr '\n' ' ')"
