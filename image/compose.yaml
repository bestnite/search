# One browser for every backend that needs one: Patchright-driven Google Chrome, a virtual display,
# noVNC holding a single window a person signs into, and a token-protected Playwright endpoint that
# any number of readers attach to. Nothing in here knows which site is being read.
#
# Build and start:   podman compose up -d --build
# Endpoint and token: podman logs search-browser
#
# Values come from this directory's .env file (compose reads it for interpolation) or from the shell.
# Copy env.example to .env and edit it; that file is not committed.
services:
  search-browser:
    build: .
    image: ghcr.io/nite07/search-browser:latest
    container_name: search-browser
    restart: unless-stopped
    environment:
      # Empty means: generate a token on first start and keep it beside the session.
      BROWSER_WS_TOKEN: "${BROWSER_WS_TOKEN:-}"
      # Set a password whenever the VNC port is published beyond loopback.
      BROWSER_VNC_PASSWORD: "${BROWSER_VNC_PASSWORD:-}"
      BROWSER_WS_PATH: /ws
      # The window starts here; sign in to whatever site needs it, in the window itself.
      BROWSER_START_URL: "${BROWSER_START_URL:-about:blank}"
    ports:
      # Host port 3000 is often taken; set BROWSER_ENDPOINT_PORT when it is.
      - "${BROWSER_BIND_ADDR:-127.0.0.1}:${BROWSER_ENDPOINT_PORT:-3000}:3000"
      - "${BROWSER_BIND_ADDR:-127.0.0.1}:${BROWSER_VNC_PORT:-6080}:6080"
    volumes:
      # A bind mount puts the session where the search core can read it:
      #   - ~/pod/search-browser/data:/profile:Z
      - browser-state:/profile
    shm_size: "1gb"      # Chromium crashes on the default 64MB

volumes:
  browser-state:
